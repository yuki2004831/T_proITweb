<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道の絶景</title>
</head>

<body>
    <header>
        <h3><a href="destinaton.html">BACK</a></h3>
    </header>
    <!-- 1つ目のスポット（四季彩の丘） -->
    <div class="spot">
        <p>
            <img src="../../photo/hokkaido/shikisainooka.jpg" alt="四季彩の丘">
        </p>
        <div class="spot-text">
             <h3>四季彩の丘</h3>
            <p>
                約15haの丘に四季折々の花々が広がる美瑛の人気スポット。<br>
                美しい花畑や十勝岳連峰の絶景、アルパカとのふれあいなど、一年を通して北海道の自然を満喫できます。
            </p>
        </div>   
    </div>

    <!-- 2つ目のスポット（旭山動物園） -->
    <div class="spot">
        <p>
            <img src="../../photo/hokkaido/zoo.jpg" alt="旭山動物園">
        </p>
        <div class="spot-text">
            <h3>旭山動物園</h3>
            <p>
                旭山動物園は、動物本来の行動や生態を間近で観察できる「行動展示」が魅力の動物園です。<br>
                四季を通してさまざまな動物たちの姿を楽しむことができます。
            </p>
        </div>
    </div>

    <!-- 3つ目のスポット（小樽運河） -->
    <div class="spot">
        <p>
            <img src="../../photo/hokkaido/otaru.jpg" alt="小樽運河">
        </p>
        <div class="spot-text">
            <h3>小樽運河</h3>
            <p>
                小樽運河は、歴史ある石造りの倉庫群とレトロな街並みが広がる、小樽を代表する観光スポットです。<br>
                昼と夜で異なる美しい景色を楽しむことができます。<br>
                さらに、新鮮な海鮮グルメを楽しめるため、多くの観光客で賑わいます。
            </p>
        </div>
    </div>
    <footer>

    </footer>
     
</body>
<style>
    body{
        background-color:#e8f5e9;
        margin: 0;
        padding: 20px;
    }
    .spot{
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 40px;
    }
    .spot p{
        margin: 0;
    }
    .spot img{
        width: 400px;
        height: 300px;
        object-fit: cover;
        display: block;
    }
    .spt-text h3{
        margin-top: 0;
        margin-bottom: 10px;
    }
    header{
        position: fixed;
        top: 10px;
        right: 20px;
    }
   
</style>
</html>
